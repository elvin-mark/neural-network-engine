[package]
name = "neural-network-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "An efficient, pure-Rust deep learning engine with dynamic autograd, strided tensors, and modern NN/LLM primitives"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elvin-mark/neural-network-engine"
readme = "README.md"
keywords = ["deep-learning", "neural-network", "autograd", "tensor", "machine-learning"]
categories = ["science", "algorithms"]


[lib]
name = "neural_network_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
rayon = "1.10"
rand = "0.8"
rand_distr = "0.4"
thiserror = "2.0"
safetensors = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
wgpu = { version = "0.19", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"], optional = true }
numpy = { version = "0.22", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "gemm_bench"
harness = false

[[example]]
name = "01_spiral_mlp"
path = "examples/01_spiral_mlp.rs"

