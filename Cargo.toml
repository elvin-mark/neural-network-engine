[package]
name = "neural-network-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "An efficient, pure-Rust deep learning engine with dynamic autograd, strided tensors, and modern NN/LLM primitives"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elvin-mark/neural-network-engine"
readme = "README.md"
keywords = ["deep-learning", "neural-network", "autograd", "tensor", "machine-learning"]
categories = ["science", "algorithms"]


[dependencies]
rayon = "1.10"
rand = "0.8"
rand_distr = "0.4"
thiserror = "2.0"
safetensors = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "gemm_bench"
harness = false

[[example]]
name = "01_spiral_mlp"
path = "examples/01_spiral_mlp.rs"

[[example]]
name = "02_mnist_convnet"
path = "examples/02_mnist_convnet.rs"

[[example]]
name = "03_character_lm"
path = "examples/03_character_lm.rs"

[[example]]
name = "04_transformer_lm"
path = "examples/04_transformer_lm.rs"

[[example]]
name = "05_llama2_gqa"
path = "examples/05_llama2_gqa.rs"

[[example]]
name = "06_iris_classification"
path = "examples/06_iris_classification.rs"

[[example]]
name = "07_digits_recognition"
path = "examples/07_digits_recognition.rs"

[[example]]
name = "08_cifar10_convnet"
path = "examples/08_cifar10_convnet.rs"

[[example]]
name = "09_cifar100_convnet"
path = "examples/09_cifar100_convnet.rs"

[[example]]
name = "10_cifar100_vit"
path = "examples/10_cifar100_vit.rs"

[[example]]
name = "11_llama_bpe_training"
path = "examples/11_llama_bpe_training.rs"







